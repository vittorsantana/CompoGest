<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompoTree | Gestão de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <h1>CompoTree</h1>
        <p>Sistema de Gestão de Produtos e Custos</p>
    </header>

    <main class="conteudo">
        <section class="cartao">
            <h2>Bem-vindo ao CompoTree</h2>
            <p>
                Gerencie produtos, componentes e custos de fabricação
                em um só lugar.
            </p>
            <button type="button">Cadastrar produto</button>
            <button type="button" class="secundario">Consultar fórmulas</button>
            <p class="aviso">
                Esta é a primeira tela visual. Os botões serão conectados
                às funcionalidades nas próximas etapas.
            </p>
        </section>
    </main>
</body>
</html>
